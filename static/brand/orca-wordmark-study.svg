    </g></g><text class="orca-copyable-letters" x="0" y="90" fill="currentColor">ORCA</text><path aria-hidden="true" pointer-events="none" fill="#F58F9C" d="M257 41H269V53H257Z"/></svg><text x="20" y="490" font-family="Arial,sans-serif" font-size="17" fill="#171536">O · Eye patch</text><text x="20" y="524" font-family="Arial,sans-serif" font-size="15" fill="#6B6880">An eye patch above a purple</text><text x="20" y="548" font-family="Arial,sans-serif" font-size="15" fill="#6B6880">sea, with an S-shaped</text><text x="20" y="572" font-family="Arial,sans-serif" font-size="15" fill="#6B6880">reflection.</text><text x="265" y="490" font-family="Arial,sans-serif" font-size="17" fill="#171536">R · Swimming motion</text><text x="265" y="524" font-family="Arial,sans-serif" font-size="15" fill="#6B6880">A curved leg carries the</text><text x="265" y="548" font-family="Arial,sans-serif" font-size="15" fill="#6B6880">movement of a swimming</text><text x="265" y="572" font-family="Arial,sans-serif" font-size="15" fill="#6B6880">tail.</text><text x="510" y="490" font-family="Arial,sans-serif" font-size="17" fill="#171536">C · Precise editing</text><text x="510" y="524" font-family="Arial,sans-serif" font-size="15" fill="#6B6880">A coral point at the</text><text x="510" y="548" font-family="Arial,sans-serif" font-size="15" fill="#6B6880">opening evokes precise RNA</text><text x="510" y="572" font-family="Arial,sans-serif" font-size="15" fill="#6B6880">editing.</text><text x="755" y="490" font-family="Arial,sans-serif" font-size="17" fill="#171536">A · Dorsal fin</text><text x="755" y="524" font-family="Arial,sans-serif" font-size="15" fill="#6B6880">A swept dorsal-fin</text><text x="755" y="548" font-family="Arial,sans-serif" font-size="15" fill="#6B6880">silhouette gives the letter</text><text x="755" y="572" font-family="Arial,sans-serif" font-size="15" fill="#6B6880">its distinctive profile.</text></svg>