<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1090" role="group" aria-labelledby="map-title map-desc">
<title id="map-title">ORCA stakeholder map — version 2</title><desc id="map-desc">Six groups connected to ORCA by concerns and recorded responses. Dashed links identify gaps, including insufficient direct voices of people with AD and family caregivers. Connections are not a treatment pathway or a score of importance.</desc>
<style>@font-face{font-family:Futura;src:url('/static/cursor/Futura-Medium.ttf')}text{font-family:Futura,'Avenir Next',sans-serif;fill:#171536}.heading{font:700 40px Georgia,serif;fill:#2E267C}.role{font:700 25px Georgia,serif;fill:#2E267C}.who{font-size:19px;fill:#6B6880}.line{font-size:19px}.response{font-size:18px;fill:#2E267C}.small{font-size:16px;fill:#6B6880}.node{cursor:pointer}.node:hover .role,.node:focus .role{fill:#5D5AD7}.node:hover .dot,.node:focus .dot{fill:#F58F9C}.connection{fill:none;stroke:#9D9CF4;stroke-width:2}.gap{fill:none;stroke:#6B6880;stroke-dasharray:7 7;stroke-width:1.7}</style>
<rect width="1400" height="1090" fill="#FFFEFC"/>
<text x="70" y="64" class="heading">Who shapes ORCA, and how?</text>
<text x="72" y="99" class="who">Version 2 · Relationships grounded in our current records</text>

