<svg class="sm-circuit sb-board" viewBox="0 0 1240 1440" role="group" aria-labelledby="sm-title sm-desc" xmlns="http://www.w3.org/2000/svg">
<title id="sm-title">ORCA safety review board</title>
<desc id="sm-desc">Eight risk inputs feed a shared review rail. Four processing modules ask what could go wrong, which safeguards are in place, what the evidence shows and whether the next step can proceed. Authorization and records, and Access, Privacy and Misuse review enter Decide. A decision selector offers Proceed to the next defined step, Redesign with a return to Constrain, More evidence with a return to Detect, or Stop. Six project areas are listed at the bottom. Focus a module to highlight its connected lines; activate it to read the corresponding section. Choose a decision to highlight its route. Escape clears the selection.</desc>
<style>.sb-board, .sb-board * { animation: none!important; transition: none!important; }
.sb-board text { font: 22px Futura, sans-serif; text-anchor: middle; fill: #171536; }
.sb-board .sb-start { text-anchor: start; }
.sb-board :is(path,circle,rect) { stroke: #2e267c; stroke-width: 2; fill: none; }
.sb-board .sb-main { stroke-width: 4; marker-end: url(#sb-arrow); }
.sb-board .sb-input { stroke: #6b6880; stroke-width: 1.6; }
.sb-board .sb-return { stroke: #8d88b6; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#sb-arrow); }
.sb-board .sb-terminal { fill: #fffefc; }
.sb-board .sb-junction { fill: #6b6880; stroke: none; }
.sb-board .sb-eyebrow { font-size: 18px; letter-spacing: 1.2px; fill: #6b6880; }
.sb-board .sb-start-label { font-size: 18px; fill: #2e267c; }
.sb-board .sb-number { font-size: 18px; fill: #6b6880; }
.sb-board .sb-scale { font-size: 21px; }
.sb-board .sb-module-frame { fill: #fffefc; stroke: #2e267c; stroke-width: 2.3; }
.sb-board .sb-module-title { font-size: 34px; fill: #2e267c; }
.sb-board .sb-question { font-size: 21px; }
.sb-board .sb-keywords { font-size: 19px; fill: #6b6880; }
.sb-board .sb-input-label { font-size: 20px; fill: #2e267c; }
.sb-board .sb-security-detail { font-size: 16px; }
.sb-board .sb-selector-label { font-size: 22px; fill: #2e267c; }
.sb-board .sb-selector { fill: #fffefc; stroke-width: 2.5; }
.sb-board .sb-selector-arm { visibility: hidden; stroke-width: 3; }
.sb-board .sb-return-label { font-size: 18px; fill: #6b6880; }
.sb-board .sb-contact { fill: #fffefc; }
.sb-board .sb-hit { stroke: none; fill: transparent; }
.sb-board .sb-outcome-label { font-size: 23px; fill: #2e267c; }
.sb-board .sb-proceed-note { font-size: 17px; fill: #514d66; }
.sb-board .sb-scope { font-size: 22px; fill: #514d66; }
.sb-board .sb-scope-detail { font-size: 15px; fill: #6b6880; }
.sb-board .sb-footer-rule { stroke: #d9d7e5; stroke-width: 1; }
.sb-board a.sb-module { text-decoration: none; }
.sb-board a.sb-module:hover .sb-module-title { text-decoration: underline; }
.sb-board :is(.sb-module,.sb-outcome) { cursor: pointer; outline: none; }
.sb-board[data-active="anticipate"] { --sb-active-color: #355da8; --sb-active-fill: #edf2fb; --sb-active-arrow: url(#sb-arrow-anticipate); }
.sb-board [data-module="anticipate"] { --sb-module-color: #355da8; --sb-module-fill: #edf2fb; }
.sb-board[data-active="constrain"] { --sb-active-color: #7450a2; --sb-active-fill: #f2edfa; --sb-active-arrow: url(#sb-arrow-constrain); }
.sb-board [data-module="constrain"] { --sb-module-color: #7450a2; --sb-module-fill: #f2edfa; }
.sb-board[data-active="detect"] { --sb-active-color: #23796c; --sb-active-fill: #eaf6f1; --sb-active-arrow: url(#sb-arrow-detect); }
.sb-board [data-module="detect"] { --sb-module-color: #23796c; --sb-module-fill: #eaf6f1; }
.sb-board[data-active="decide"] { --sb-active-color: #ad4d62; --sb-active-fill: #fcf0f2; --sb-active-arrow: url(#sb-arrow-decide); }
.sb-board [data-module="decide"] { --sb-module-color: #ad4d62; --sb-module-fill: #fcf0f2; }
.sb-board[data-active="anticipate"] [data-module="anticipate"] .sb-module-frame,
.sb-board[data-active="constrain"] [data-module="constrain"] .sb-module-frame,
.sb-board[data-active="detect"] [data-module="detect"] .sb-module-frame,
.sb-board[data-active="decide"] [data-module="decide"] .sb-module-frame { stroke: var(--sb-active-color); fill: var(--sb-active-fill); stroke-width: 3.5; }
.sb-board[data-active="anticipate"] [data-module="anticipate"] .sb-module-title,
.sb-board[data-active="constrain"] [data-module="constrain"] .sb-module-title,
.sb-board[data-active="detect"] [data-module="detect"] .sb-module-title,
.sb-board[data-active="decide"] [data-module="decide"] .sb-module-title { fill: var(--sb-active-color); }
.sb-board .sb-module:focus-visible .sb-module-frame { stroke: var(--sb-module-color); fill: var(--sb-module-fill); stroke-width: 3.5; }
.sb-board .sb-module:focus-visible .sb-module-title { fill: var(--sb-module-color); }
.sb-board .sb-outcome:focus-visible .sb-hit { stroke: #5d5ad7; stroke-width: 2.5; }
.sb-board .sb-outcome:hover .sb-outcome-label { text-decoration: underline; }
.sb-board[data-active="anticipate"] [data-for~="anticipate"],
.sb-board[data-active="constrain"] [data-for~="constrain"],
.sb-board[data-active="detect"] [data-for~="detect"],
.sb-board[data-active="decide"] [data-for~="decide"] { stroke: var(--sb-active-color); stroke-width: 3; }
.sb-board[data-selection="proceed"] [data-arm="proceed"],
.sb-board[data-selection="redesign"] [data-arm="redesign"],
.sb-board[data-selection="more"] [data-arm="more"],
.sb-board[data-selection="stop"] [data-arm="stop"] { visibility: visible; }
.sb-board[data-active="anticipate"] :is(.sb-main,.sb-return)[data-for~="anticipate"],
.sb-board[data-active="constrain"] :is(.sb-main,.sb-return)[data-for~="constrain"],
.sb-board[data-active="detect"] :is(.sb-main,.sb-return)[data-for~="detect"],
.sb-board[data-active="decide"] :is(.sb-main,.sb-return)[data-for~="decide"] { marker-end: var(--sb-active-arrow); }
.sb-board .sb-return { cursor: pointer; pointer-events: stroke; }
.sb-board[data-selection="redesign"] [data-return="redesign"] { stroke: #7450a2; stroke-width: 3.5; marker-end: url(#sb-arrow-constrain); }
.sb-board[data-selection="more"] [data-return="more"] { stroke: #23796c; stroke-width: 3.5; marker-end: url(#sb-arrow-detect); }
.sb-board[data-active="constrain"] [data-return-label="redesign"],
.sb-board[data-selection="redesign"] [data-return-label="redesign"] { fill: #7450a2; }
.sb-board[data-active="detect"] [data-return-label="more"],
.sb-board[data-selection="more"] [data-return-label="more"] { fill: #23796c; }
.sb-board .sb-outcome[aria-pressed="true"] .sb-contact { fill: #e9e8ff; stroke: #5d5ad7; }
.sb-board .sb-outcome[aria-pressed="true"] .sb-outcome-label { fill: #5d5ad7; }
