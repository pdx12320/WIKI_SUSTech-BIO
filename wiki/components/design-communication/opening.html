<section class="design-opening" id="design-opening" data-design-opening
         data-duration="7500"
         role="dialog" aria-modal="true" aria-label="ORCA mascot opening animation" hidden inert>
  <img class="design-opening__media design-opening__media--bottom-left" data-design-opening-animation
       data-image="https://static.igem.wiki/teams/6085/wiki/design/stories/mascot-opening-bottom-left.webp"
       width="459" height="598" alt="The ORCA mascot peeks in and waves from the bottom-left corner." hidden>
  <img class="design-opening__media design-opening__media--top-right" data-design-opening-animation
       data-image="https://static.igem.wiki/teams/6085/wiki/design/stories/mascot-opening-top-right.webp"
       width="357" height="350" alt="The ORCA mascot tumbles in from the top-right corner." hidden>
  <img class="design-opening__media design-opening__media--bottom-left" data-design-opening-still
       data-image="https://static.igem.wiki/teams/6085/wiki/design/stories/mascot-opening-bottom-left-still.avif"
       width="459" height="598" alt="The ORCA mascot waving." hidden>
  <div class="design-opening__title" data-design-opening-title aria-hidden="true">
    <span class="design-opening__title-lead">Design &amp;</span>
    <span class="design-opening__title-main">Media Promotion</span>
  </div>
  <button class="design-opening__skip" type="button" data-design-opening-skip>Skip opening <span aria-hidden="true">↗</span></button>
</section>
<button class="design-opening-replay" type="button" data-design-opening-replay aria-controls="design-opening" hidden>
  <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 2.5 11 7l-7 4.5Z" fill="currentColor"/></svg>
  <span data-design-opening-replay-label>Replay opening</span>
</button>
