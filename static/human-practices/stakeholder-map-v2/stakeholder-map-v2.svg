<path class="connection" d="M800 495 C900 495 900 707 900 707"/>
<circle cx="700" cy="495" r="110" fill="#E9E8FF" stroke="#2E267C" stroke-width="2"/>
<text x="700" y="477" text-anchor="middle" class="heading">ORCA</text>
<text x="700" y="513" text-anchor="middle" class="line">Research &amp; choices</text>
<text x="700" y="541" text-anchor="middle" class="small">Communication &amp; support</text>

<g class="node" data-node="clinical" tabindex="0" role="button" aria-label="Explore Clinical care"><rect x="68" y="118" width="440" height="160" fill="transparent"/><circle class="dot" cx="58" cy="140" r="7" fill="#5D5AD7"/><text x="80" y="148" class="role">Clinical care</text><text x="80" y="181" class="who">Dr. Zhifan Zhou</text><text x="80" y="225" class="line">Delivery, repeat dosing and treatment burden</text><text x="80" y="257" class="response">→ Gave delivery and care burdens greater priority</text></g>
<g class="node" data-node="older" tabindex="0" role="button" aria-label="Explore Older participants"><rect x="68" y="365" width="440" height="160" fill="transparent"/><circle class="dot" cx="58" cy="387" r="7" fill="#5D5AD7"/><text x="80" y="395" class="role">Older participants</text><text x="80" y="428" class="who">Shahe &amp; Taoyuan service centers</text><text x="80" y="472" class="line">Useful explanations and materials they can use</text><text x="80" y="504" class="response">→ Revised the workbook; gathered early app feedback</text></g>
<g class="node" data-node="care" tabindex="0" role="button" aria-label="Explore Everyday care"><rect x="68" y="612" width="440" height="160" fill="transparent"/><circle class="dot" cx="58" cy="634" r="7" fill="#5D5AD7"/><text x="80" y="642" class="role">Everyday care</text><text x="80" y="675" class="who">Ms. Wu · Shahe service staff</text><text x="80" y="719" class="line">Readable pages, writing space and staff time</text><text x="80" y="751" class="response">→ Changed workbook layout and practical support</text></g>
<g class="node" data-node="research" tabindex="0" role="button" aria-label="Explore Research &amp; choice"><rect x="933" y="118" width="440" height="160" fill="transparent"/><circle class="dot" cx="923" cy="140" r="7" fill="#5D5AD7"/><text x="945" y="148" class="role">Research &amp; choice</text><text x="945" y="181" class="who">Prof. Keqiang Ye · Dr. Ziwei Dai</text><text x="945" y="225" class="line">Specificity, evidence and the freedom to decline</text><text x="945" y="257" class="response">→ Expanded safety assessment and explanations</text></g>
<g class="node" data-node="public" tabindex="0" role="button" aria-label="Explore Public understanding"><rect x="933" y="365" width="440" height="160" fill="transparent"/><circle class="dot" cx="923" cy="387" r="7" fill="#5D5AD7"/><text x="945" y="395" class="role">Public understanding</text><text x="945" y="428" class="who">103 survey respondents</text><text x="945" y="472" class="line">Benefits, risks, intended users and evidence</text><text x="945" y="504" class="response">→ Put these questions before technical detail</text></g>
<g class="node" data-node="partners" tabindex="0" role="button" aria-label="Explore Implementation partners"><rect x="933" y="612" width="440" height="160" fill="transparent"/><circle class="dot" cx="923" cy="634" r="7" fill="#5D5AD7"/><text x="945" y="642" class="role">Implementation partners</text><text x="945" y="675" class="who">Shokz · university laboratory discussions</text><text x="945" y="719" class="line">Safety, technical support and partner priorities</text><text x="945" y="751" class="response">→ Ended the wearable route; reconsidered feasibility</text></g>
<path class="gap" d="M700 605 V835"/>
<rect x="70" y="858" width="1260" height="156" rx="0" fill="none" stroke="#6B6880" stroke-width="1.5" stroke-dasharray="7 7"/>
<text x="100" y="900" class="role">Whose voices do we still need to hear?</text>
<text x="100" y="936" class="line">People with AD and family caregivers · Direct input remains insufficient</text>
<text x="100" y="969" class="who">Future implementation: delivery, manufacturing and access need further consultation.</text>
<text x="72" y="1056" class="small">Solid lines: recorded engagement · Dashed: evidence gaps · Placement does not rank importance or influence.</text>
</svg>