<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>递送模型 · 实际材质预览</title>
<link rel="stylesheet" href="../software-delivery-mechanisms-3d.css">
<style>
:root{--sans:Arial,sans-serif;color:#29243e;background:#f7f6f9;font-family:var(--sans)}
*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1440px;margin:auto}
h1{font-size:25px;letter-spacing:-.02em;margin:0 0 8px}p.intro{color:#706879;font-size:14px;line-height:1.6;margin:0 0 22px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 20px}
.controls button{border:1px solid #d9d3e2;border-radius:8px;background:#fff;padding:11px 16px;font:inherit;font-size:14px;color:#484057;cursor:pointer}
.controls button[aria-pressed=true]{background:#443574;border-color:#443574;color:white}.controls button:focus-visible,input:focus-visible{outline:3px solid #8e77b8;outline-offset:3px}
.controls button[data-body-play]{margin-left:auto}.delivery-mechanisms__scenes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.delivery-mechanisms__viewport{height:min(61vh,600px);min-height:320px}.delivery-mechanisms__card header{padding:18px 20px 0}
.delivery-mechanisms__card h4{font-size:18px!important}.delivery-mechanisms__key{font-size:13px!important;padding-bottom:8px}.delivery-mechanisms__compartments{font-size:13px}
.delivery-body__sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.scrub{display:flex;align-items:center;gap:14px;margin:20px 0 10px;color:#706879;font-size:13px}.scrub input{flex:1;accent-color:#6f558e;cursor:pointer}output{min-width:38px;text-align:right}
.note{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:#7a7180;font-size:12px;line-height:1.6}.note a{color:#68547f}
@media(max-width:760px){body{padding:18px}.delivery-mechanisms__scenes{grid-template-columns:1fr}.delivery-mechanisms__viewport{height:390px}.controls button[data-body-play]{margin-left:0}.controls button{padding:10px 12px}}
</style>
</head>
<body><main data-material-preview data-body-current-stage="2">
<h1>两个模型 · 实际材质预览</h1>
<p class="intro">拖拽模型旋转，查看表面质感。选择一个阶段播放，也可以拖动进度条停在任意位置。</p>
<div class="controls" role="group" aria-label="选择演示阶段">
<button type="button" data-preview-stage="2" aria-pressed="true">血脑屏障运输</button>
<button type="button" data-preview-stage="3" aria-pressed="false">细胞内表达</button>
<button type="button" data-preview-stage="4" aria-pressed="false">RNA 编辑</button>
<button type="button" data-body-play aria-pressed="false" disabled>播放</button>
</div>
<div class="delivery-mechanisms" data-delivery-mechanisms-3d data-mechanism-module="/static/software-delivery-mechanisms-3d.js" data-mechanism-css="/static/software-delivery-mechanisms-3d.css">
  <div class="delivery-mechanisms__fallback" data-mechanism-fallback><p>正在载入三维模型…</p></div>
  <div class="delivery-mechanisms__scenes" data-mechanism-scenes hidden>
    <section class="delivery-mechanisms__card" aria-labelledby="mechanism-barrier-title">
      <header><h4 id="mechanism-barrier-title">Blood–brain barrier</h4><button type="button" data-mechanism-reset="barrier" aria-label="Reset barrier view" title="Reset barrier view">↺</button></header>
      <div class="delivery-mechanisms__viewport" data-mechanism-3d="barrier"></div>
      <div class="delivery-mechanisms__compartments" aria-label="Barrier compartments"><span>Blood side</span><span>Endothelium</span><span>Brain ISF</span></div>
      <p class="delivery-mechanisms__key"><i class="delivery-mechanisms__dot delivery-mechanisms__dot--cargo" aria-hidden="true"></i>AAV <i class="delivery-mechanisms__dot delivery-mechanisms__dot--vesicle" aria-hidden="true"></i>Vesicle</p>
    </section>
    <section class="delivery-mechanisms__card" aria-labelledby="mechanism-cell-title">
      <header><h4 id="mechanism-cell-title">Expression &amp; RNA editing</h4><button type="button" data-mechanism-reset="cell" aria-label="Reset cell view" title="Reset cell view">↺</button></header>
      <div class="delivery-mechanisms__viewport" data-mechanism-3d="cell"></div>
      <p class="delivery-mechanisms__key delivery-mechanisms__key--cell"><i class="delivery-mechanisms__dot delivery-mechanisms__dot--nucleus" aria-hidden="true"></i>Nucleus <i class="delivery-mechanisms__dot delivery-mechanisms__dot--rna" aria-hidden="true"></i>RNA <i class="delivery-mechanisms__dot delivery-mechanisms__dot--editor" aria-hidden="true"></i>Editor <strong data-mechanism-edit-state>C → U</strong></p>
    </section>
    <p class="delivery-body__sr-only" data-mechanism-status role="status">Drag to rotate · arrow keys to orbit · Home to reset</p>
  </div>
</div>
<label class="scrub"><span>阶段进度</span><input type="range" min="0" max="1000" value="0" step="1" data-preview-progress aria-label="阶段进度"><output data-preview-percent>0%</output></label>
<div class="note"><span data-preview-status role="status">正在载入当前模型…</span><a href="/software#software-figure-2">返回 Software 页面</a></div>
<footer class="note" style="margin-top:20px"><span>© 2026 SUSTech · <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC BY 4.0</a></span><a href="https://gitlab.igem.org/2026/sustech">Wiki source</a></footer>
</main><script type="module" src="./software-materials-20261021.js"></script></body></html>
