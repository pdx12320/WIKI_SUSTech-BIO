<header class="contribution-opening" data-contribution-opening aria-labelledby="contribution-opening-title">
  <div class="contribution-opening__stage">
    <h1 id="contribution-opening-title" aria-label="Contribution"><span class="contribution-opening__word" aria-hidden="true">{% for letter in 'Contribution' %}<span class="contribution-opening__letter">{{ letter }}</span>{% endfor %}</span><button class="contribution-opening__period" type="button" aria-label="Replay the Contribution relay" title="Replay"><span aria-hidden="true"></span></button></h1>
    <p class="contribution-opening__caption">Build on what we built.</p>
    <span class="contribution-opening__baton" aria-hidden="true" hidden></span>
    <span class="contribution-opening__ripple" aria-hidden="true"></span>
  </div>
  <a class="contribution-opening__read" href="#sonar"><span>SCROLL TO BEGIN</span><svg width="20" height="32" viewBox="0 0 20 32" fill="none" aria-hidden="true"><path d="M10 2v25m-5-5 5 5 5-5" stroke="currentColor" stroke-width="1.2"/></svg></a>
</header>
